[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech-catalog-watch"
version = "0.1.0"
description = "Audit-friendly competitor catalog decisions using semantic matching"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "httpx>=0.27,<1"]

[project.scripts]
catalog-watch = "catalog_risk_service.service:run"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_risk_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
